# What Pyo runs on: its namespace, image registry, BuildKit and Postgres.
# Pyo itself is in pyo.yaml. Apply both with scripts/pyo-up.sh, which
# also creates the Postgres secret and fills in the image tag.
#
# Multi-node notes:
#   - the image registry answers inside the cluster only (pyo-registry, for
#     Pyo itself); this node's containerd and BuildKit reach it on
#     127.0.0.1:5005 through pyo-host. Other machines (servers, builders)
#     reach it only through Pyo's registry door, which wants a login: on
#     this node's Tailscale IP, __TAILNET_IP__:5005 (filled in by
#     pyo-up.sh), with a registries.yaml mirror (connect.sh, join.sh);
#   - volumes use local-path, so their data stays on the node that made them.
apiVersion: v1
kind: Namespace
metadata:
  name: pyo-system
  labels:
    app.kubernetes.io/part-of: pyo
---
# ── Who reaches what in pyo-system: nothing, unless allowed below. Pods
# on the host network (pyo-host, BuildKit) and the node itself (the
# kubelet's probes; pyo-host's forwards to the registry beside it) aren't
# held by these. ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: pyo-system
  labels: { app.kubernetes.io/part-of: pyo }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The dashboard, API and registry door: Pyo's front, with its own logins.
# Only from the gateway's proxies, Pyo's own pods (the worker, the agent,
# builders, the upgrader, log and traffic collectors), a database import
# fetching its dump, and the servers themselves (pyo-host's forwards on
# localhost and the tailnet, kubelet probes). Never from a project's pods:
# Pyo believes X-Forwarded-For from the pod network, so they'd name any
# address. A server reaches a pod on another server from its own end of
# the pod network: the first /31 of its range (k3s gives each server a
# /24 of 10.42.0.0/16), which pods never get; on its own server, the
# network policy always lets it in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pyo
  namespace: pyo-system
  labels: { app.kubernetes.io/part-of: pyo }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pyo }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: pyo-system }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: pyo-gateway }
        # pyo-db-controller's import Jobs, in a team's databases namespace
        # (dbimport.rs POD_LABEL); never a project's namespace.
        - namespaceSelector:
            matchExpressions:
              - { key: pyo/project-id, operator: DoesNotExist }
          podSelector:
            matchLabels: { pyo.dev/component: import }
      ports:
        - { port: 8000 }
        - { port: 5006 }
    - from: [
        { ipBlock: { cidr: 10.42.0.0/31 } }, { ipBlock: { cidr: 10.42.1.0/31 } }, { ipBlock: { cidr: 10.42.2.0/31 } }, { ipBlock: { cidr: 10.42.3.0/31 } },
        { ipBlock: { cidr: 10.42.4.0/31 } }, { ipBlock: { cidr: 10.42.5.0/31 } }, { ipBlock: { cidr: 10.42.6.0/31 } }, { ipBlock: { cidr: 10.42.7.0/31 } },
