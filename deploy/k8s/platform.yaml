# What Pyo runs on: its namespace, image registry, BuildKit and Postgres.
# Pyo itself is in pyo.yaml. Apply both with scripts/pyo-up.sh, which
# also creates the Postgres secret and fills in the image tag.
#
# Multi-node notes:
#   - the image registry answers inside the cluster only (pyo-registry, for
#     Pyo itself); this node's containerd and BuildKit reach it on
#     127.0.0.1:5005 through pyo-host. Other machines (servers, builders)
#     reach it only through Pyo's registry door, which wants a login: on
#     this node's Tailscale IP, __TAILNET_IP__:5005 (filled in by
#     pyo-up.sh), with a registries.yaml mirror (connect.sh, join.sh);
#   - volumes use local-path, so their data stays on the node that made them.
apiVersion: v1
kind: Namespace
metadata:
  name: pyo-system
  labels:
    app.kubernetes.io/part-of: pyo
---
# ── Who reaches what in pyo-system: nothing, unless allowed below. Pods
# on the host network (pyo-host, BuildKit) and the node itself (the
# kubelet's probes; pyo-host's forwards to the registry beside it) aren't
# held by these. ──
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: pyo-system
  labels: { app.kubernetes.io/part-of: pyo }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The dashboard, API and registry door: Pyo's front, with its own logins.
# The gateway, agents, builders and pyo-host reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pyo
  namespace: pyo-system
  labels: { app.kubernetes.io/part-of: pyo }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pyo }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 8000 }
        - { port: 5006 }
---
# Postgres and ClickHouse: Pyo's web and worker replicas only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pyo-databases
  namespace: pyo-system
  labels: { app.kubernetes.io/part-of: pyo }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [pyo-postgres, pyo-clickhouse] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [pyo, pyo-worker] }
      ports:
        - { port: 5432 }
        - { port: 8123 }
---
# The backup store: its S3 API from anywhere (backup jobs in projects'
# namespaces, the databases' own backups in pyo-db-*; not by namespace, as
# a job's pod would race the policy's address list when it starts), each
# with its team's key; its admin API (buckets and keys) from Pyo only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pyo-backup-store
  namespace: pyo-system
  labels: { app.kubernetes.io/part-of: pyo }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pyo-backup-store }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 3900 }
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [pyo, pyo-worker] }
      ports:
        - { port: 3903 }
---
# The registry: Pyo only (its door, image sizes and clean-up). The node's
# containerd and BuildKit come through pyo-host on the same node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry
  namespace: pyo-system
  labels: { app.kubernetes.io/part-of: pyo }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: registry }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [pyo, pyo-worker] }
      ports:
        - { port: 5000 }
---
# ── Image registry: in the cluster only (pyo-registry:5000), for Pyo's
# door and its own clean-up; on the node as 127.0.0.1:5005 through pyo-host
# (k3s pulls from it over HTTP, see /etc/rancher/k3s/registries.yaml). ──
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: pyo-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pyo-registry
  namespace: pyo-system
  labels: { app.kubernetes.io/name: registry, app.kubernetes.io/part-of: pyo }
spec:
  selector: { app.kubernetes.io/name: registry }
  ports:
    - { name: registry, port: 5000, targetPort: registry }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: pyo-system
  labels: { app.kubernetes.io/name: registry, app.kubernetes.io/part-of: pyo }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: registry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: registry, app.kubernetes.io/part-of: pyo }
    spec:
      containers:
        - name: registry
          image: registry:3.1.2
          env:
            - { name: REGISTRY_HTTP_ADDR, value: "0.0.0.0:5000" }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
            - { name: OTEL_TRACES_EXPORTER, value: "none" }
          ports:
            - { name: registry, containerPort: 5000 }
          readinessProbe:
            httpGet: { path: /v2/, port: registry }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 512Mi }
        # Frees the layers of images Pyo deleted (deployments past the
        # team's retention). Daily; untagged manifests of live services are kept
        # because Pyo deletes by digest, never by tag.
        - name: gc
          image: registry:3.1.2
          command: ["sh", "-c", "while sleep 86400; do registry garbage-collect /etc/distribution/config.yml; done"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: registry-data }
---
# ── Pyo on this machine, beside the registry: the dashboard and API
# (:8000) on localhost and the Tailscale IP only, never public addresses;
# the registry on localhost:5005, for this node's containerd and BuildKit;
# and the registry door (logins only) on the Tailscale IP's :5005, for
# other machines' containerd and builders. The plain registry is never on
# the tailnet. Teams' own pushes use HTTPS through the gateway (:5443,
# tailnet only). ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyo-host
  namespace: pyo-system
  labels: { app.kubernetes.io/name: pyo-host, app.kubernetes.io/part-of: pyo }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: pyo-host }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pyo-host, app.kubernetes.io/part-of: pyo }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # On the registry's node: its connections from this node's own
      # address are the ones the registry's network policy lets through.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app.kubernetes.io/name: registry } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: forward
          image: alpine/socat:1.8.1.3
          command: ["sh", "-c"]
          args:
            - |
              IP="__TAILNET_IP__"
              to=TCP:pyo.pyo-system.svc.cluster.local:8000
              socat TCP-LISTEN:8000,bind=127.0.0.1,fork,reuseaddr $to &
              socat TCP-LISTEN:5005,bind=127.0.0.1,fork,reuseaddr TCP:pyo-registry.pyo-system.svc.cluster.local:5000 &
              if [ -n "$IP" ]; then
                socat TCP-LISTEN:8000,bind="$IP",fork,reuseaddr $to &
                socat TCP-LISTEN:5005,bind="$IP",fork,reuseaddr TCP:pyo-registry-door.pyo-system.svc.cluster.local:5006 &
              fi
              wait
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 64Mi }
---
# ── BuildKit for building Pyo's own images from a repository copy
# (scripts/pyo-up.sh). Listens on 127.0.0.1:1234 on the node, without TLS:
# reachable only from this host. Stopped (0 replicas) except while pyo-up.sh
# builds; its cache volume stays. Services from Git build on builders
# (the agent's builder.rs), not here. ──
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd
  namespace: pyo-system
data:
  buildkitd.toml: |
    [registry."127.0.0.1:5005"]
      http = true
      insecure = true
    [worker.oci]
      gc = true
      gckeepstorage = "20GB"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-cache
  namespace: pyo-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: pyo-system
  labels: { app.kubernetes.io/name: buildkitd, app.kubernetes.io/part-of: pyo }
spec:
  replicas: 0
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: buildkitd }
  template:
    metadata:
      labels: { app.kubernetes.io/name: buildkitd, app.kubernetes.io/part-of: pyo }
    spec:
      hostNetwork: true
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.34.1
          args:
            - --addr=tcp://127.0.0.1:1234
            - --addr=unix:///run/buildkit/buildkitd.sock
            - --config=/etc/buildkit/buildkitd.toml
          securityContext:
            privileged: true
          readinessProbe:
            exec: { command: [buildctl, debug, workers] }
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/buildkit }
            - { name: cache, mountPath: /var/lib/buildkit }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: buildkitd }
        - name: cache
          persistentVolumeClaim: { claimName: buildkit-cache }
---
# ── Postgres: the control plane's source of truth. The password lives in
# the pyo-postgres secret (created by scripts/pyo-up.sh). ──
apiVersion: v1
kind: Service
metadata:
  name: pyo-postgres
  namespace: pyo-system
  labels: { app.kubernetes.io/name: pyo-postgres, app.kubernetes.io/part-of: pyo }
spec:
  selector: { app.kubernetes.io/name: pyo-postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pyo-postgres
  namespace: pyo-system
  labels: { app.kubernetes.io/name: pyo-postgres, app.kubernetes.io/part-of: pyo }
spec:
  serviceName: pyo-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pyo-postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pyo-postgres, app.kubernetes.io/part-of: pyo }
    spec:
      # Start as the image's postgres user (uid 70, which owns the data): the
      # entrypoint then starts Postgres directly, without switching users.
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          # Sized for a small server: Pyo's database is small and mostly
          # cached by the OS. Connections: up to 2 web and 2 worker pods
          # while they roll (pools of 10 and 15, each with its listeners),
          # backups and migrations, with room to spare.
          args:
            - -c
            - shared_buffers=32MB
            - -c
            - effective_cache_size=256MB
            - -c
            - work_mem=2MB
            - -c
            - maintenance_work_mem=32MB
            - -c
            - wal_buffers=1MB
            - -c
            - max_connections=80
            - -c
            - autovacuum_max_workers=2
            - -c
            - jit=off
          env:
            - { name: POSTGRES_DB, value: pyo }
            - { name: POSTGRES_USER, value: pyo }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: pyo-postgres, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: [pg_isready, -U, pyo, -d, pyo] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
# ── ClickHouse: observability data (web analytics and server metrics).
# Rows expire after 180 days. Password in the pyo-clickhouse secret. ──
apiVersion: v1
kind: Service
metadata:
  name: pyo-clickhouse
  namespace: pyo-system
  labels: { app.kubernetes.io/name: pyo-clickhouse, app.kubernetes.io/part-of: pyo }
spec:
  selector: { app.kubernetes.io/name: pyo-clickhouse }
  ports:
    - { name: http, port: 8123, targetPort: http }
---
# ClickHouse's settings for a small machine, on top of the image's own:
# no system log tables (Pyo reads none), small caches and thread pools,
# a memory ceiling below the pod's limit, so a heavy Analytics query
# spills to disk or fails instead of the pod, and a few queries at once.
# Pyo's user has the default profile: 2 threads and 200 MiB a query.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pyo-clickhouse
  namespace: pyo-system
  labels: { app.kubernetes.io/name: pyo-clickhouse, app.kubernetes.io/part-of: pyo }
data:
  config.xml: |
    <clickhouse>
        <!-- Warnings and errors only, and little of them on disk. -->
        <logger>
            <level>warning</level>
            <size>50M</size>
            <count>2</count>
        </logger>

        <!-- System log tables Pyo never reads: each would keep a table, a
             flush thread and its buffers. -->
        <query_log remove="1"/>
        <query_thread_log remove="1"/>
        <query_views_log remove="1"/>
        <query_metric_log remove="1"/>
        <trace_log remove="1"/>
        <instrumentation_trace_log remove="1"/>
        <metric_log remove="1"/>
        <asynchronous_metric_log remove="1"/>
        <part_log remove="1"/>
        <text_log remove="1"/>
        <error_log remove="1"/>
        <crash_log remove="1"/>
        <session_log remove="1"/>
        <processors_profile_log remove="1"/>
        <opentelemetry_span_log remove="1"/>
        <asynchronous_insert_log remove="1"/>
        <background_schedule_pool_log remove="1"/>
        <backup_log remove="1"/>
        <blob_storage_log remove="1"/>
        <iceberg_metadata_log remove="1"/>
        <delta_lake_metadata_log remove="1"/>
        <zookeeper_log remove="1"/>
        <zookeeper_connection_log remove="1"/>
        <aggregated_zookeeper_log remove="1"/>

        <!-- Memory: what ClickHouse allocates stays under 70% of the pod's
             limit (it reads the limit as the machine's memory); the rest is
             its code. Past it a query fails rather than the pod. -->
        <max_server_memory_usage>0</max_server_memory_usage>
        <max_server_memory_usage_to_ram_ratio>0.7</max_server_memory_usage_to_ram_ratio>
        <!-- A few queries at once (an Analytics page sends 14): the rest wait
             their turn (queue_max_wait_ms in the profile) rather than all
             sharing the memory above and some failing. -->
        <max_concurrent_queries>6</max_concurrent_queries>
        <merges_mutations_memory_usage_soft_limit>134217728</merges_mutations_memory_usage_soft_limit>
        <mark_cache_size>16777216</mark_cache_size>
        <uncompressed_cache_size>0</uncompressed_cache_size>
        <index_mark_cache_size>0</index_mark_cache_size>
        <index_uncompressed_cache_size>0</index_uncompressed_cache_size>
        <primary_index_cache_size>16777216</primary_index_cache_size>
        <mmap_cache_size>64</mmap_cache_size>
        <compiled_expression_cache_size>8388608</compiled_expression_cache_size>
        <compiled_expression_cache_elements_size>1000</compiled_expression_cache_elements_size>
        <query_condition_cache_size>8388608</query_condition_cache_size>
        <query_cache>
            <max_size_in_bytes>0</max_size_in_bytes>
            <max_entries>0</max_entries>
        </query_cache>

        <!-- Threads -->
        <max_thread_pool_size>500</max_thread_pool_size>
        <max_thread_pool_free_size>10</max_thread_pool_free_size>
        <thread_pool_queue_size>500</thread_pool_queue_size>
        <max_io_thread_pool_size>16</max_io_thread_pool_size>
        <max_active_parts_loading_thread_pool_size>2</max_active_parts_loading_thread_pool_size>
        <max_outdated_parts_loading_thread_pool_size>2</max_outdated_parts_loading_thread_pool_size>
        <max_unexpected_parts_loading_thread_pool_size>2</max_unexpected_parts_loading_thread_pool_size>
        <max_parts_cleaning_thread_pool_size>2</max_parts_cleaning_thread_pool_size>
        <max_prefixes_deserialization_thread_pool_size>2</max_prefixes_deserialization_thread_pool_size>
        <max_format_parsing_thread_pool_size>2</max_format_parsing_thread_pool_size>
        <max_backups_io_thread_pool_size>2</max_backups_io_thread_pool_size>
        <max_fetch_partition_thread_pool_size>1</max_fetch_partition_thread_pool_size>
        <max_build_vector_similarity_index_thread_pool_size>1</max_build_vector_similarity_index_thread_pool_size>
        <async_insert_threads>1</async_insert_threads>
        <tables_loader_foreground_pool_size>2</tables_loader_foreground_pool_size>
        <tables_loader_background_pool_size>2</tables_loader_background_pool_size>
        <background_pool_size>2</background_pool_size>
        <background_merges_mutations_concurrency_ratio>2</background_merges_mutations_concurrency_ratio>
        <background_schedule_pool_size>16</background_schedule_pool_size>
        <background_common_pool_size>2</background_common_pool_size>
        <background_move_pool_size>1</background_move_pool_size>
        <background_fetches_pool_size>1</background_fetches_pool_size>
        <background_buffer_flush_schedule_pool_size>1</background_buffer_flush_schedule_pool_size>
        <background_message_broker_schedule_pool_size>1</background_message_broker_schedule_pool_size>
        <background_distributed_schedule_pool_size>1</background_distributed_schedule_pool_size>
        <background_streaming_schedule_pool_size>1</background_streaming_schedule_pool_size>
        <parts_killer_pool_size>1</parts_killer_pool_size>
        <prefetch_threadpool_pool_size>2</prefetch_threadpool_pool_size>
        <load_marks_threadpool_pool_size>2</load_marks_threadpool_pool_size>
        <threadpool_writer_pool_size>2</threadpool_writer_pool_size>
        <threadpool_local_fs_reader_pool_size>2</threadpool_local_fs_reader_pool_size>

        <merge_tree>
            <!-- The pool above has 4 slots: don't hold merges small while
                 it's busy, and let mutations run. -->
            <number_of_free_entries_in_pool_to_lower_max_size_of_merge>0</number_of_free_entries_in_pool_to_lower_max_size_of_merge>
            <number_of_free_entries_in_pool_to_execute_mutation>0</number_of_free_entries_in_pool_to_execute_mutation>
            <number_of_free_entries_in_pool_to_execute_optimize_entire_partition>0</number_of_free_entries_in_pool_to_execute_optimize_entire_partition>
        </merge_tree>
    </clickhouse>
  users.xml: |
    <clickhouse>
        <profiles>
            <default>
                <max_threads>2</max_threads>
                <max_memory_usage>209715200</max_memory_usage>
                <max_bytes_before_external_group_by>33554432</max_bytes_before_external_group_by>
                <max_bytes_ratio_before_external_group_by>0.2</max_bytes_ratio_before_external_group_by>
                <max_bytes_before_external_sort>33554432</max_bytes_before_external_sort>
                <max_bytes_ratio_before_external_sort>0.2</max_bytes_ratio_before_external_sort>
                <max_execution_time>30</max_execution_time>
                <queue_max_wait_ms>20000</queue_max_wait_ms>
                <log_queries>0</log_queries>
            </default>
        </profiles>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pyo-clickhouse
  namespace: pyo-system
  labels: { app.kubernetes.io/name: pyo-clickhouse, app.kubernetes.io/part-of: pyo }
spec:
  serviceName: pyo-clickhouse
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pyo-clickhouse }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pyo-clickhouse, app.kubernetes.io/part-of: pyo }
      # Raise with any change to the pyo-clickhouse ConfigMap: ClickHouse
      # reads it at start, so the pod restarts to pick it up.
      annotations: { pyo.dev/config: "1" }
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.8.36.3
          env:
            - { name: CLICKHOUSE_DB, value: pyo_observability }
            - { name: CLICKHOUSE_USER, value: pyo }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: pyo-clickhouse, key: password } }
          ports:
            - { name: http, containerPort: 8123 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
          # One file each, not the directories: the image's entrypoint writes
          # Pyo's user into users.d.
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: config, mountPath: /etc/clickhouse-server/config.d/pyo.xml, subPath: config.xml, readOnly: true }
            - { name: config, mountPath: /etc/clickhouse-server/users.d/pyo.xml, subPath: users.xml, readOnly: true }
          # With this config: ~80 MiB idle, ~105 MiB holding a month of a
          # busy site, ~200-250 MiB at the peak of Analytics pages (measured).
          # ClickHouse stops at 70% of the limit; the rest is its code.
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: pyo-clickhouse }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
# ── Backup store: S3-compatible storage on this cluster (Garage, the
# official image, unmodified), the default destination of backups ("This
# server"), Pyo's own and teams'. Off-site copies need an external bucket:
# this one lives on the same disks.
#
# Its S3 API (:3900, region "garage", path-style) answers signed requests
# from anywhere; its admin API (:3903, buckets and keys) only Pyo, with the
# admin token; RPC (:3901) stays on the pod's localhost. Pyo sets it up at
# start over the admin API (backupstore.rs): the node in the layout, Pyo's
# key (pyo-backup-store secret, never leaves Pyo) and bucket pyo-backups.
# Each team gets a bucket and a key that reaches only it. ──
apiVersion: v1
kind: ConfigMap
metadata:
  name: pyo-backup-store
  namespace: pyo-system
  labels: { app.kubernetes.io/name: pyo-backup-store, app.kubernetes.io/part-of: pyo }
data:
  # rpc_secret and admin_token come from the pyo-backup-store secret
  # (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN). No compression: restic and
  # Barman data arrives compressed and encrypted already. Blocks waiting to
  # be written may hold 64 MiB of memory at most.
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"
    replication_factor = 1
    compression_level = "none"
    block_ram_buffer_max = "64MiB"
    rpc_bind_addr = "127.0.0.1:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "0.0.0.0:3900"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
    metrics_require_token = true
---
apiVersion: v1
kind: Service
metadata:
  name: pyo-backup-store
  namespace: pyo-system
  labels: { app.kubernetes.io/name: pyo-backup-store, app.kubernetes.io/part-of: pyo }
spec:
  selector: { app.kubernetes.io/name: pyo-backup-store }
  ports:
    - { name: s3, port: 3900, targetPort: s3 }
    - { name: admin, port: 3903, targetPort: admin }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pyo-backup-store
  namespace: pyo-system
  labels: { app.kubernetes.io/name: pyo-backup-store, app.kubernetes.io/part-of: pyo }
spec:
  serviceName: pyo-backup-store
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pyo-backup-store }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pyo-backup-store, app.kubernetes.io/part-of: pyo }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: garage
          # v2.5.0
          image: dxflrs/garage@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
          command: [/garage, -c, /etc/garage/garage.toml, server]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom: { secretKeyRef: { name: pyo-backup-store, key: rpc-secret } }
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: pyo-backup-store, key: admin-token } }
          ports:
            - { name: s3, containerPort: 3900 }
            - { name: admin, containerPort: 3903 }
          # Ready once it listens: the layout is Pyo's to set up, over the
          # admin API, which wants the pod ready first.
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/garage, readOnly: true }
            - { name: data, mountPath: /var/lib/garage }
          # Idle it holds ~6 MiB; a big restic or Barman upload stays under
          # 200 MiB (block buffers are capped at 64 MiB above). The limit
          # leaves room for several uploads at once and LMDB's page cache.
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: pyo-backup-store }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 50Gi
