# cargo-deny: https://embarkstudios.github.io/cargo-deny/
#
# CI runs it on every pull request (ci.yml, job cargo-deny). Advisories
# and sources fail the check. Licenses and bans only warn there for now
# (the job continues on error), until they're clean enough to enforce.
#
#   cargo deny check                       # everything
#   cargo deny check advisories sources    # what CI enforces

[graph]
# The platforms Pyo and its CLI are built for.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# RustSec vulnerabilities are always errors. Unmaintained and unsound
# crates are errors only when a Pyo crate depends on them directly.
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
# Checked and found not to apply. The same list as .cargo/audit.toml.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin attack) is reached only through webauthn-rs, which verifies signatures with RSA public keys. Pyo never decrypts or signs with an RSA private key there. crypto-glue 0.2.2 can't use the fixed rsa 0.10.0 yet." },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys is in Cargo.lock only as a weak optional dependency of sqlx. Pyo uses sqlx's Postgres driver alone and never builds it." },
]

[licenses]
# Permissive licenses that can ship inside Pyo (Apache-2.0), and MPL-2.0,
# whose terms cover only its own files.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
# Pyo's own crates aren't published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    { name = "openssl", reason = "Pyo uses rustls for TLS." },
    { name = "openssl-sys", reason = "Pyo uses rustls for TLS." },
]

[sources]
# Crates come from crates.io only: no other registry, no git.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
