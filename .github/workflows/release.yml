name: Release

# Pushing a tag like v0.1.0 publishes that version: signed images at
# ghcr.io/upsetdev/pyo, and a GitHub release with the CLI for each
# platform, the sandbox server files, the install scripts and release.json
# (what the dashboard's updates apply). Then pyo.dev is rebuilt, to serve
# the release's install scripts. See RELEASING.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  IMAGES: ghcr.io/upsetdev/pyo

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - run: scripts/install-railpack.sh
      - run: cargo test --locked --workspace
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The templates this release bundles are pyo-templates' main, as CI
      # checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: upsetdev/pyo-templates
          ref: main
          path: .pyo-templates
          persist-credentials: false
      - name: Build pyo-templates
        working-directory: .pyo-templates
        run: bun install --frozen-lockfile && bun run build
      - name: catalog.json matches pyo-templates
        run: |
          bun dash/scripts/sync-templates.ts .pyo-templates/dist/v1 --check || {
            echo "::error::dash/src/lib/pyo/catalog.json doesn't match pyo-templates' main. Run \`bun run build\` in pyo-templates, then \`bun scripts/sync-templates.ts\` in dash/, commit catalog.json on dev, and release again."
            exit 1
          }
      # The WAF's processor (waf/).
      - name: WAF tests
        run: docker run --rm -v "$PWD/waf:/src" -w /src -e CGO_ENABLED=0 golang:1.26 sh -c 'go vet ./... && go test ./...'

  # The Rust binaries of every Rust image, built once (pyo.Dockerfile's
  # `rust` stage) into this run's build cache; each Rust image's job below
  # takes that stage from the cache instead of compiling it again. Only a
  # cache: if a job can't read it, it compiles the stage itself, from the
  # same source, with the same result.
  binaries:
    name: Rust binaries
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/pyo.Dockerfile
          target: bins
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-to: type=gha,mode=max,scope=rust-${{ github.run_id }}

  # The CLI for macOS, Windows and Linux on Arm (cli.yml).
  cli:
    name: CLI
    needs: verify
    uses: ./.github/workflows/cli.yml

  # A sandbox server's files for each architecture (sandbox.yml).
  sandbox:
    name: Sandbox
    needs: verify
    uses: ./.github/workflows/sandbox.yml

  images:
    name: Publish ${{ matrix.image }}
    needs: [verify, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # Signing: proves the image came from this workflow.
    strategy:
      fail-fast: true
      matrix:
        image: [pyo, agent, builder, flows, waf, geoip, db-controller, kv, static]
        # Pyo's Postgres, one image per version, from one Dockerfile.
        # One repository, tagged <version>-<release>: CloudNativePG reads
        # the version from the tag.
        include:
          # The Rust images: one Dockerfile with a target each.
          - { image: pyo, file: pyo, target: pyo, rust: true }
          - { image: agent, file: pyo, target: agent, rust: true }
          - { image: builder, file: pyo, target: builder, rust: true }
          - { image: flows, file: pyo, target: flows, rust: true }
          - { image: db-controller, file: pyo, target: db-controller, rust: true }
          - { image: kv, file: pyo, target: kv, rust: true }
          - { image: static, file: pyo, target: static, rust: true }
          - { image: postgres-16, repo: postgres, tag: "16-", file: postgres, context: deploy/images, args: PG_MAJOR=16 }
          - { image: postgres-17, repo: postgres, tag: "17-", file: postgres, context: deploy/images, args: PG_MAJOR=17 }
          - { image: postgres-18, repo: postgres, tag: "18-", file: postgres, context: deploy/images, args: PG_MAJOR=18 }
          # MySQL's operator and backup image: MOCO, patched
          # (deploy/images/moco), one Dockerfile with a target each.
          - { image: mysql-operator, file: moco/moco, context: deploy/images/moco, target: operator }
          - { image: mysql-backup, file: moco/moco, context: deploy/images/moco, target: backup }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context || '.' }}
          file: deploy/images/${{ matrix.file || matrix.image }}.Dockerfile
          build-args: ${{ matrix.args }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms || 'linux/amd64' }}
          cache-from: ${{ matrix.rust && format('type=gha,scope=rust-{0}', github.run_id) || '' }}
          push: true
          tags: ${{ env.IMAGES }}/${{ matrix.repo || matrix.image }}:${{ matrix.tag }}${{ needs.verify.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Sign
        env:
          IMAGE: ${{ env.IMAGES }}/${{ matrix.repo || matrix.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      # Installations and sandbox servers pull without logging in. A new
      # package on ghcr.io may start private: make it public in its
      # package settings, then run the job again.
      - name: Anyone can pull it
        env:
          REPO: upsetdev/pyo/${{ matrix.repo || matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$REPO:pull" | jq -r .token)
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/$REPO/manifests/$DIGEST")
          if [ "$code" != 200 ]; then
            echo "::error::ghcr.io/$REPO can't be pulled without logging in (HTTP $code). Make the package public in its settings on GitHub, then run this job again."
            exit 1
          fi

  release:
    name: GitHub release
    needs: [verify, images, cli, sandbox]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
      # Signing release.json keyless (Sigstore, this workflow's identity).
      id-token: write
    steps:
      # Every commit and tag: the notes list the changes since the last release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The sandbox servers' files and their sha256, from the sandbox job.
      # release.json lists the sums, so they're signed with it: sandbox.sh
      # checks release.json's signature, then the file for its architecture.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sandbox-*
          path: sandbox
          merge-multiple: true
      - name: Check the sandbox files
        run: |
          cd sandbox
          for a in x86_64 aarch64; do
            sha256sum -c "pyo-sandbox-linux-$a.tar.gz.sha256"
            sha256sum -c "pyo-sandbox-gvisor-linux-$a.tar.gz.sha256"
          done
      # What Pyo needs to update itself from the dashboard: the images
      # pinned by the digests that were just signed, and the manifests.
      # Also the install scripts as the release publishes them, written to
      # release-scripts/ (connect.sh, join.sh and sandbox.sh with this
      # version on their pyo:release-version line), and their SHA-256:
      # pyo.dev serves only scripts that match these signed sums.
      - name: Write release.json
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          digest() { docker buildx imagetools inspect "$IMAGES/$1:$VERSION" --format '{{json .Manifest}}' | jq -r .digest; }
          tagged() { docker buildx imagetools inspect "$IMAGES/$1:$2$VERSION" --format '{{json .Manifest}}' | jq -r .digest; }
          bun run scripts/release-manifest.ts --version "$VERSION" --images "$IMAGES" \
            --pyo "$(digest pyo)" --agent "$(digest agent)" --builder "$(digest builder)" --flows "$(digest flows)" --waf "$(digest waf)" --geoip "$(digest geoip)" \
            --db-controller "$(digest db-controller)" --kv "$(digest kv)" --static "$(digest static)" \
            --mysql-operator "$(digest mysql-operator)" --mysql-backup "$(digest mysql-backup)" \
            --postgres-16 "$(tagged postgres 16-)" --postgres-17 "$(tagged postgres 17-)" --postgres-18 "$(tagged postgres 18-)" \
            --agent-access "$(docker run --rm "$IMAGES/agent:$VERSION@$(digest agent)" access-hash)" \
            --sandbox-x86_64 "$(cut -d' ' -f1 sandbox/pyo-sandbox-linux-x86_64.tar.gz.sha256)" \
            --sandbox-aarch64 "$(cut -d' ' -f1 sandbox/pyo-sandbox-linux-aarch64.tar.gz.sha256)" \
            --sandbox-gvisor-x86_64 "$(cut -d' ' -f1 sandbox/pyo-sandbox-gvisor-linux-x86_64.tar.gz.sha256)" \
            --sandbox-gvisor-aarch64 "$(cut -d' ' -f1 sandbox/pyo-sandbox-gvisor-linux-aarch64.tar.gz.sha256)" \
            --scripts release-scripts > release.json
          jq '{version, images, k3s, minFrom, manualOnly, beforeYouUpdate, agentAccess, sandbox, sandboxGvisor, scripts, migrations: (.migrations | length)}' release.json
      # The release's own upgrader reads it before it's signed: an image
      # it doesn't accept, or an agentAccess that isn't its agent's roles,
      # fails the release here, not on installations.
      - name: Check release.json with the release's upgrader
        run: docker run --rm -v "$PWD/release.json:/release.json:ro" "$(jq -r .images.agent release.json)" check-release /release.json
      # release.json is signed like the images: keyless, as this workflow
      # at this tag. install.sh, pyo-up.sh --release and the dashboard's
      # updates (pyo-api sigstore.rs) check it before using anything in it.
      # The signing config pins Sigstore's public instance with Rekor v1,
      # whose signed entry timestamp is what Pyo's own check reads.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign release.json
        run: cosign sign-blob --yes --signing-config .github/release-signing-config.json --bundle release.json.sigstore.json release.json
      # The CLI for Linux x86-64 (pyo.Dockerfile's `cli` target), from the
      # binaries this run built. deploy/cli.sh and `pyo upgrade` download
      # the one for their platform and check it against its sha256.
      - name: Build the CLI
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/pyo.Dockerfile
          target: cli
          platforms: linux/amd64
          cache-from: type=gha,scope=rust-${{ github.run_id }}
          outputs: type=local,dest=cli
      - name: Name the CLI
        run: |
          cp cli/pyo pyo-linux-x86_64
          sha256sum pyo-linux-x86_64 > pyo-linux-x86_64.sha256
      # The other platforms' CLIs and their sha256, from the cli job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: cli-platforms
          merge-multiple: true
      - name: Check the CLIs
        run: |
          cd cli-platforms
          for a in pyo-linux-aarch64 pyo-macos-aarch64 pyo-macos-x86_64 pyo-windows-x86_64.exe; do
            sha256sum -c "$a.sha256"
          done
      # The release's text: the changes since the previous release, from the
      # Conventional Commits in between (scripts/release-notes.ts).
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run scripts/release-notes.ts --to "$GITHUB_REF_NAME" --release release.json > release-notes.md && cat release-notes.md
      # The release goes up as a draft with every asset, and is published
      # once they're all there: with immutable releases (on for this repo),
      # a published release's assets and tag can't change. Run again after
      # a failure, this job replaces the draft's assets. A release that's
      # published already is left as it is.
      #
      # The install scripts are release-scripts/'s: install.sh (pyo.dev/install.sh
      # is the latest release's), connect.sh (also for install.sh --uninstall),
      # join.sh, sandbox.sh (beside the sandbox files it installs) and cli.sh,
      # the CLI's installer.
      - name: Upload the release as a draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            pyo-linux-x86_64
            pyo-linux-x86_64.sha256
            cli-platforms/pyo-linux-aarch64
            cli-platforms/pyo-linux-aarch64.sha256
            cli-platforms/pyo-macos-aarch64
            cli-platforms/pyo-macos-aarch64.sha256
            cli-platforms/pyo-macos-x86_64
            cli-platforms/pyo-macos-x86_64.sha256
            cli-platforms/pyo-windows-x86_64.exe
            cli-platforms/pyo-windows-x86_64.exe.sha256
            release.json
            release.json.sigstore.json
            release-scripts/install.sh
            release-scripts/cli.sh
            release-scripts/connect.sh
            release-scripts/join.sh
            release-scripts/sandbox.sh
            sandbox/pyo-sandbox-linux-x86_64.tar.gz
            sandbox/pyo-sandbox-linux-x86_64.tar.gz.sha256
            sandbox/pyo-sandbox-linux-aarch64.tar.gz
            sandbox/pyo-sandbox-linux-aarch64.tar.gz.sha256
            sandbox/pyo-sandbox-gvisor-linux-x86_64.tar.gz
            sandbox/pyo-sandbox-gvisor-linux-x86_64.tar.gz.sha256
            sandbox/pyo-sandbox-gvisor-linux-aarch64.tar.gz
            sandbox/pyo-sandbox-gvisor-linux-aarch64.tar.gz.sha256
          )
          if ! draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>&1); then
            grep -q "release not found" <<<"$draft" || { echo "$draft"; exit 1; }
            draft=none
          fi
          case "$draft" in
            false)
              echo "::notice::$GITHUB_REF_NAME is published already, so its assets stay as they are."
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            true)
              gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
              gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
              ;;
            none)
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
                --notes-file release-notes.md "${files[@]}"
              ;;
          esac
      # What the draft holds now: each install script as release.json lists it.
      - name: Check the draft's install scripts
        if: steps.draft.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern '*.sh' --dir uploaded
          jq -r '.scripts | to_entries[] | "\(.value)  uploaded/\(.key)"' release.json | sha256sum -c
          [ "$(ls uploaded | wc -l)" = "$(jq '.scripts | length' release.json)" ]
      - name: Publish the release
        if: steps.draft.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  # pyo.dev serves the latest release's install scripts, and each release's
  # at pyo.dev/v/<version>/. Its build takes them from the published
  # release only when they match the sums in its signed release.json. This
  # asks Cloudflare's Workers Builds for that build, through a deploy hook
  # whose URL is the secret PYO_WEB_DEPLOY_HOOK (Cloudflare dashboard >
  # Workers & Pages > pyo-web > Settings > Builds > Deploy Hooks). When it
  # fails, run this job again: the release stays as it is.
  site:
    name: Rebuild pyo.dev
    needs: release
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Ask Workers Builds to build pyo-web
        env:
          HOOK: ${{ secrets.PYO_WEB_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::The secret PYO_WEB_DEPLOY_HOOK isn't set, so pyo.dev wasn't rebuilt and still serves the previous release's scripts. Make a deploy hook for pyo-web in Cloudflare (Workers & Pages > pyo-web > Settings > Builds > Deploy Hooks), save its URL as this repo's PYO_WEB_DEPLOY_HOOK secret, and run this job again."
            exit 1
          fi
          case "$HOOK" in
            https://api.cloudflare.com/client/v4/workers/builds/deploy_hooks/*) ;;
            *) echo "::error::PYO_WEB_DEPLOY_HOOK isn't a Workers Builds deploy hook URL."; exit 1 ;;
          esac
          out=$(curl -fsS -X POST --retry 3 --max-time 30 "$HOOK") || { echo "::error::The deploy hook didn't answer. Check that it still exists in Cloudflare."; exit 1; }
          if [ "$(echo "$out" | jq -r '.success // empty' 2>/dev/null)" = false ]; then
            echo "::error::Cloudflare refused the build: $(echo "$out" | jq -c '.errors')"
            exit 1
          fi
          echo "Build started: $(echo "$out" | jq -r '.result.build_uuid // .build_uuid // "see the Cloudflare dashboard"' 2>/dev/null)"
