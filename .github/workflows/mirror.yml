name: Mirror images

# Copies the third-party images Pyo runs (deploy/mirrors.txt) to
# ghcr.io/upsetdev/pyo-mirror, so installs never pull from Docker Hub,
# whose anonymous pulls are rate limited (scripts/mirror-images.sh). Each
# copy keeps every platform and the source's digest, and is checked
# against it. Nothing is rebuilt, and the mirrors aren't signed: Pyo
# didn't build them, and they're pinned by the source's digest wherever
# they're used (release.json, which is signed, lists them too).
#
# - Each release, before it's published (release.yml calls this).
# - On dev and main when the list changes, so what's merged can run there.
# - On a working branch when the list changes: a trial run, with "-test"
#   after each tag. Nothing uses those.
# - By hand (workflow_dispatch), with a suffix for a trial run.
#
# A new package on ghcr.io may start private. The run says which: make it
# public in its package settings on GitHub, then run this again.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      suffix:
        description: "After each tag, for a trial run (e.g. -test). Empty: the real tags."
        type: string
        default: "-test"
  push:
    branches:
      - main
      - dev
      - "fix/**"
      - "chore/**"
      - "ci/**"
    paths:
      - deploy/mirrors.txt
      - scripts/mirror-images.sh
      - .github/workflows/mirror.yml
      - .github/actions/crane/**

permissions:
  contents: read

concurrency:
  group: mirror-images-${{ github.ref }}

jobs:
  mirror:
    name: Mirror images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/crane
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The real tags for a release (its tag), dev and main. "-test" ones
      # for a working branch. By hand, the suffix asked for.
      - name: Copy and check them
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT: ${{ inputs.suffix }}
        run: |
          case "$EVENT:$REF" in
            workflow_dispatch:*) suffix=$INPUT ;;
            *:refs/tags/* | *:refs/heads/main | *:refs/heads/dev) suffix= ;;
            *) suffix=-test ;;
          esac
          scripts/mirror-images.sh copy "$suffix"
