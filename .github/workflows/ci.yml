name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrations:
    name: Migrations keep the previous release working
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun test ./scripts
      - name: Check migrations
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BASE=$(sh scripts/migrations-base.sh)
          if [ -z "$BASE" ]; then
            echo "The first commit: no earlier migrations to keep working."
            exit 0
          fi
          bun run scripts/check-migrations.ts --base "$BASE"

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test ./dash/scripts
      - run: bun run build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: scripts/install-railpack.sh
      - run: cargo test --locked --workspace

  waf:
    name: WAF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD/waf:/src" -w /src -e CGO_ENABLED=0 golang:1.26 sh -c 'go vet ./... && go test ./...'

  # install.sh as a user runs it, on a fresh machine: this branch's script
  # with the latest release's images, end to end (k3s, the upgrader with
  # the RBAC it applies, every rollout), then Pyo answers.
  install:
    name: install.sh on a fresh machine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Pyo
        run: |
          set -o pipefail
          sudo bash deploy/install.sh < /dev/null 2>&1 | sed 's/^\(  Password: \).*/\1(hidden)/'
      - name: Pyo answers
        run: |
          curl -fsS http://localhost:8000/api/v1/meta
          sudo k3s kubectl -n pyo-system get pods
      - name: What went wrong
        if: failure()
        run: |
          sudo k3s kubectl get pods -A -o wide || true
          sudo k3s kubectl -n pyo-system logs -l app.kubernetes.io/name=pyo-upgrade --tail=100 || true
          sudo k3s kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
