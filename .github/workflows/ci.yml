name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrations:
    name: Migrations keep the previous release working
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun test ./scripts
      # install.sh's functions, with kubectl stubbed.
      - run: bash scripts/install.test.sh
      # sandbox.sh's functions, with the machine's commands stubbed.
      - run: bash scripts/sandbox.test.sh
      - name: Check migrations
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BASE=$(sh scripts/migrations-base.sh)
          if [ -z "$BASE" ]; then
            echo "The first commit: no earlier migrations to keep working."
            exit 0
          fi
          bun run scripts/check-migrations.ts --base "$BASE"

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test ./dash/scripts
      - run: bun run build

  # The dashboard bundles pyo-templates' catalog as catalog.json. It has to
  # match pyo-templates' main, or Pyo ships old templates.
  templates:
    name: Template catalog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: upsetdev/pyo-templates
          ref: main
          path: .pyo-templates
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Build pyo-templates
        working-directory: .pyo-templates
        run: bun install --frozen-lockfile && bun run build
      - name: catalog.json matches pyo-templates
        run: |
          bun dash/scripts/sync-templates.ts .pyo-templates/dist/v1 --check || {
            echo "::error::dash/src/lib/pyo/catalog.json doesn't match pyo-templates' main. Run \`bun run build\` in pyo-templates, then \`bun scripts/sync-templates.ts\` in dash/, and commit catalog.json."
            exit 1
          }

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: pyo
          POSTGRES_DB: pyo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: scripts/install-railpack.sh
      - run: cargo test --locked --workspace
      # Row security and teams against a real Postgres: what a person's
      # requests may see and change, signing up, creating and joining teams,
      # and the Cloudflare Tunnel loop against a fake Cloudflare.
      - name: Teams and row security (Postgres)
        env:
          DATABASE_URL: postgres://postgres:pyo@localhost:5432/pyo
        run: cargo test --locked -p pyo-api --lib -- --ignored rls::tests teams_rls_tests teamsec_tests auth::key_tests auth::invite_tests cloudflare::http_tests

  # Known CVEs in the locked dependencies: Cargo.lock, bun.lock (with the
  # dashboard's dev dependencies) and the WAF's go.mod. A CRITICAL one
  # with a fix fails the check. HIGH ones are reported in the job's
  # summary and in code scanning.
  lockfiles:
    name: Lockfile CVEs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/trivy
      - name: Scan for CVEs
        id: scan
        run: .github/scripts/trivy-scan.sh fs . trivy
      # A fork's pull request can't write to code scanning.
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: trivy.sarif
          category: lockfiles
      - name: No CRITICAL CVE with a fix
        if: steps.scan.outputs.critical != '0'
        env:
          CRITICAL: ${{ steps.scan.outputs.critical }}
        run: |
          echo "::error::The lockfiles have $CRITICAL CRITICAL CVEs with a fix (see the job's summary). Update those dependencies, or add a CVE that doesn't apply to .trivyignore with the reason."
          exit 1

  # cargo-deny, configured in deny.toml. RustSec advisories and crates
  # from anywhere but crates.io fail the check. Licenses and banned or
  # duplicate crates only warn for now (continue-on-error), until they're
  # clean enough to enforce.
  cargo-deny:
    name: cargo-deny ${{ matrix.checks }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories sources, bans licenses]
    continue-on-error: ${{ matrix.checks == 'bans licenses' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: 1.99.1
          command: check ${{ matrix.checks }}

  # Pyo Sandbox end to end: real Firecracker microVMs on the runner's KVM.
  # x64 only, as GitHub's arm runners have no KVM. The networking e2e
  # changes the host's network as root, so it runs last.
  sandbox:
    name: Sandbox end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: pyo
          POSTGRES_DB: pyo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # Where this branch's base template image goes, for the daemon to pull.
      registry:
        image: registry:3.0.0
        ports: ["5000:5000"]
    env:
      PYO_SANDBOX_ENVD: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/pyo-envd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner has no KVM (/dev/kvm is missing), so it can't boot microVMs."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          for _ in 1 2 3 4 5; do [ -r /dev/kvm ] && [ -w /dev/kvm ] && break; sleep 1; done
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::This runner has no KVM it can use (/dev/kvm isn't open to the runner user)."
            exit 1
          fi
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox-static e2fsprogs nftables musl-tools
      # Firecracker, the jailer and a guest kernel, checked against pinned
      # sha256 sums. Saved right after the download, before any test runs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: assets
        with:
          path: .cache/sandbox-e2e
          key: sandbox-e2e-assets-${{ hashFiles('crates/pyo-sandbox/scripts/firecracker.env', 'crates/pyo-sandbox/scripts/e2e-assets.sh') }}
      - name: Firecracker and kernel
        run: |
          set -euo pipefail
          crates/pyo-sandbox/scripts/e2e-assets.sh | tee -a "$GITHUB_ENV"
          echo "PYO_SANDBOX_JAILER=$PWD/.cache/sandbox-e2e/bin/jailer" >> "$GITHUB_ENV"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.assets.outputs.cache-hit != 'true'
        with:
          path: .cache/sandbox-e2e
          key: ${{ steps.assets.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sandbox
      # ring compiles C for the musl target, with musl-gcc.
      - name: Build pyo-envd (musl) and the daemon
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked -p pyo-envd --target x86_64-unknown-linux-musl
          cargo build --locked -p pyo-sandbox
      # Pyo's built-in template `base`, from the images.json Pyo ships with
      # (upsetdev/pyo-sandbox-images), pulled from ghcr.io.
      - name: pyo-sandbox e2e
        env:
          PYO_SANDBOX_E2E: "1"
        run: |
          PYO_SANDBOX_E2E_BASE_IMAGE=$(jq -r .images.base.ref crates/pyo-api/assets/sandbox-images/images.json)
          export PYO_SANDBOX_E2E_BASE_IMAGE
          cargo test --locked -p pyo-sandbox --test e2e --test template_e2e -- --nocapture
      - name: pyo-api sandbox e2e
        env:
          PYO_SANDBOX_E2E: "1"
          DATABASE_URL: postgres://postgres:pyo@localhost:5432/pyo
        run: cargo test --locked -p pyo-api sandbox::e2e -- --nocapture
      # As root, jailed like on a real server. cargo isn't on root's PATH,
      # so the runner user builds the test binary and sudo -E runs only it.
      - name: Networking e2e (root)
        env:
          PYO_SANDBOX_NET_E2E: "1"
        run: |
          set -euo pipefail
          bin=$(cargo test --locked -p pyo-sandbox --test network_e2e --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "network_e2e" and .executable != null) | .executable')
          [ -x "$bin" ] || { echo "::error::No network_e2e test binary."; exit 1; }
          sudo -E "$bin" --nocapture
      - name: What went wrong
        if: failure()
        run: |
          sudo iptables -S FORWARD || true
          sudo nft list ruleset | head -80 || true
          ls -la .cache/sandbox-e2e || true

  # Pyo Sandbox on gVisor, end to end: runsc as root, as on a server
  # without KVM (Hetzner Cloud). Firecracker is left out, so detection
  # falls back to gVisor although the runner has KVM. It mounts disks and
  # changes the host's network, which the runner is for.
  gvisor:
    name: Sandbox on gVisor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYO_SANDBOX_ENVD: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/pyo-envd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox-static e2fsprogs nftables musl-tools zstd
      # runsc, the release pinned in gvisor.env, checked against its sha512.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: runsc
        with:
          path: .cache/sandbox-gvisor
          key: sandbox-gvisor-${{ hashFiles('crates/pyo-sandbox/scripts/gvisor.env', 'crates/pyo-sandbox/scripts/gvisor-assets.sh') }}
      - name: runsc
        run: |
          set -euo pipefail
          crates/pyo-sandbox/scripts/gvisor-assets.sh | tee -a "$GITHUB_ENV"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.runsc.outputs.cache-hit != 'true'
        with:
          path: .cache/sandbox-gvisor
          key: ${{ steps.runsc.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sandbox-gvisor
      - name: Build pyo-envd (musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p pyo-envd --target x86_64-unknown-linux-musl
      # As root. cargo isn't on root's PATH, so the runner user builds the
      # test binary and sudo -E runs only it.
      - name: gVisor e2e (root)
        env:
          PYO_SANDBOX_GVISOR_E2E: "1"
        run: |
          set -euo pipefail
          bin=$(cargo test --locked -p pyo-sandbox --test gvisor_e2e --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "gvisor_e2e" and .executable != null) | .executable')
          [ -x "$bin" ] || { echo "::error::No gvisor_e2e test binary."; exit 1; }
          sudo -E "$bin" --nocapture
      - name: What went wrong
        if: failure()
        run: |
          sudo find /tmp -name runsc.log -path '*pyo-gvisor-e2e*' -exec tail -n 40 {} \; || true
          sudo nft list ruleset | head -80 || true
          ip netns list || true

  waf:
    name: WAF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD/waf:/src" -w /src -e CGO_ENABLED=0 golang:1.26 sh -c 'go vet ./... && go test ./...'

  # install.sh as a user runs it, on a fresh machine: this branch's script
  # with the latest release's images, end to end (k3s, the upgrader with
  # the RBAC it applies, every rollout), then Pyo answers.
  install:
    name: install.sh on a fresh machine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # What install.sh sets outside its functions goes along when it runs
      # again with sudo (its SETTINGS): without it, a sudo user's install
      # fails at once.
      - name: install.sh passes all its settings to sudo
        run: |
          export LC_ALL=C
          bash -c '
            vars() { compgen -v | sort; }
            a=$(vars)
            source <(sed "\$d" deploy/install.sh)
            missing=$(comm -13 <(echo "$a") <(vars) | grep -vxE "a|PIPESTATUS|SETTINGS|${SETTINGS// /|}" || true)
            [ -z "$missing" ] || { echo "install.sh sets these outside its functions, and they are not in its SETTINGS: $missing" >&2; exit 1; }
          '
      # As the docs say: piped into bash by a user with sudo, not root.
      - name: Make a sudo user
        run: |
          sudo useradd -m pyo-ci
          echo 'pyo-ci ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/pyo-ci >/dev/null
          sudo install -m 644 deploy/install.sh crates/pyo-api/assets/connect.sh crates/pyo-api/assets/join.sh /home/pyo-ci/
      - name: connect.sh and join.sh get root from a sudo user
        run: |
          # Past sudo, the root shell reads the options and stops at the
          # unknown one (exit 2). Without root it stops before that (exit 1).
          for s in connect join; do
            set +e
            out=$(sudo -iu pyo-ci bash -c "cat $s.sh | bash -s -- --not-an-option" 2>&1)
            rc=$?
            set -e
            echo "$out"
            [ "$rc" = 2 ] && grep -q 'Unknown option: --not-an-option' <<<"$out" || { echo "$s.sh: exit $rc, not 2" >&2; exit 1; }
          done
      # A test isn't an install: PYO_TELEMETRY=off sends no install count
      # and turns usage counts off.
      - name: Install Pyo
        run: |
          set -o pipefail
          sudo -iu pyo-ci env PYO_TELEMETRY=off bash -c 'cat install.sh | bash' 2>&1 | sed 's/^\(  Password: \).*/\1(hidden)/'
      - name: Again as root, nothing to update
        run: |
          set -o pipefail
          sudo env PYO_TELEMETRY=off bash deploy/install.sh < /dev/null 2>&1 | sed 's/^\(  Password: \).*/\1(hidden)/'
      - name: Pyo answers
        run: |
          curl -fsS http://localhost:8000/api/v1/meta
          sudo k3s kubectl -n pyo-system get pods
      - name: What went wrong
        if: failure()
        run: |
          sudo k3s kubectl get pods -A -o wide || true
          sudo k3s kubectl -n pyo-system logs -l app.kubernetes.io/name=pyo-upgrade --tail=100 || true
          sudo k3s kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
