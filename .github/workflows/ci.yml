name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrations:
    name: Migrations keep the previous release working
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun test ./scripts
      # install.sh's functions, with kubectl stubbed.
      - run: bash scripts/install.test.sh
      - name: Check migrations
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BASE=$(sh scripts/migrations-base.sh)
          if [ -z "$BASE" ]; then
            echo "The first commit: no earlier migrations to keep working."
            exit 0
          fi
          bun run scripts/check-migrations.ts --base "$BASE"

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test ./dash/scripts
      - run: bun run build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: scripts/install-railpack.sh
      - run: cargo test --locked --workspace

  waf:
    name: WAF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD/waf:/src" -w /src -e CGO_ENABLED=0 golang:1.26 sh -c 'go vet ./... && go test ./...'

  # install.sh as a user runs it, on a fresh machine: this branch's script
  # with the latest release's images, end to end (k3s, the upgrader with
  # the RBAC it applies, every rollout), then Pyo answers.
  install:
    name: install.sh on a fresh machine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A test isn't an install: no install count (PYO_TELEMETRY=off), and
      # api.pyo.dev doesn't resolve inside k3s, so Pyo's first update check
      # sends no usage counts and falls back to GitHub. k3s applies this
      # manifest when it starts, and CoreDNS imports coredns-custom.
      # PYO_TELEMETRY=off turns usage counts off too, but only in a Pyo that
      # reads the pyo-install ConfigMap (0.3.2 on), and this job runs the
      # latest release's Pyo: drop this once that release is 0.3.2 or later.
      - name: Keep CI out of the counts
        run: |
          sudo install -d /var/lib/rancher/k3s/server/manifests
          sudo tee /var/lib/rancher/k3s/server/manifests/ci-no-telemetry.yaml >/dev/null <<'YAML'
          apiVersion: v1
          kind: ConfigMap
          metadata: { name: coredns-custom, namespace: kube-system }
          data:
            no-telemetry.override: |
              template IN ANY api.pyo.dev {
                rcode NXDOMAIN
              }
          YAML
      # What install.sh sets outside its functions goes along when it runs
      # again with sudo (its SETTINGS): without it, a sudo user's install
      # fails at once.
      - name: install.sh passes all its settings to sudo
        run: |
          export LC_ALL=C
          bash -c '
            vars() { compgen -v | sort; }
            a=$(vars)
            source <(sed "\$d" deploy/install.sh)
            missing=$(comm -13 <(echo "$a") <(vars) | grep -vxE "a|PIPESTATUS|SETTINGS|${SETTINGS// /|}" || true)
            [ -z "$missing" ] || { echo "install.sh sets these outside its functions, and they are not in its SETTINGS: $missing" >&2; exit 1; }
          '
      # As the docs say: piped into bash by a user with sudo, not root.
      - name: Make a sudo user
        run: |
          sudo useradd -m pyo-ci
          echo 'pyo-ci ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/pyo-ci >/dev/null
          sudo install -m 644 deploy/install.sh crates/pyo-api/assets/connect.sh crates/pyo-api/assets/join.sh /home/pyo-ci/
      - name: connect.sh and join.sh get root from a sudo user
        run: |
          # Past sudo, the root shell reads the options and stops at the
          # unknown one (exit 2). Without root it stops before that (exit 1).
          for s in connect join; do
            set +e
            out=$(sudo -iu pyo-ci bash -c "cat $s.sh | bash -s -- --not-an-option" 2>&1)
            rc=$?
            set -e
            echo "$out"
            [ "$rc" = 2 ] && grep -q 'Unknown option: --not-an-option' <<<"$out" || { echo "$s.sh: exit $rc, not 2" >&2; exit 1; }
          done
      - name: Install Pyo
        run: |
          set -o pipefail
          sudo -iu pyo-ci env PYO_TELEMETRY=off bash -c 'cat install.sh | bash' 2>&1 | sed 's/^\(  Password: \).*/\1(hidden)/'
      - name: Again as root, nothing to update
        run: |
          set -o pipefail
          sudo env PYO_TELEMETRY=off bash deploy/install.sh < /dev/null 2>&1 | sed 's/^\(  Password: \).*/\1(hidden)/'
      - name: Pyo answers
        run: |
          curl -fsS http://localhost:8000/api/v1/meta
          sudo k3s kubectl -n pyo-system get pods
      - name: What went wrong
        if: failure()
        run: |
          sudo k3s kubectl get pods -A -o wide || true
          sudo k3s kubectl -n pyo-system logs -l app.kubernetes.io/name=pyo-upgrade --tail=100 || true
          sudo k3s kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
