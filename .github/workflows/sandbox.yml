name: Sandbox

# A sandbox server's files for each architecture, as
# pyo-sandbox-linux-<arch>.tar.gz with its .sha256: the daemon and
# pyo-envd (static, musl), Firecracker and its jailer, and Pyo's guest
# kernel. deploy/sandbox.sh installs them. The Release workflow runs it and
# puts the tarballs in the GitHub release. Run it by hand (Actions ›
# Sandbox › Run workflow) to try the builds on a branch: it publishes
# nothing, the tarballs stay in the run's artifacts.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The guest kernel (crates/pyo-sandbox/scripts/guest-kernel.sh), built
  # only when the script or the Firecracker release changes: the cache
  # keeps it otherwise.
  kernel:
    name: Guest kernel ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: kernel
          key: sandbox-kernel-${{ matrix.arch }}-${{ hashFiles('crates/pyo-sandbox/scripts/guest-kernel.sh', 'crates/pyo-sandbox/scripts/firecracker.env') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential flex bison bc libelf-dev libssl-dev
          crates/pyo-sandbox/scripts/guest-kernel.sh kernel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-kernel-${{ matrix.arch }}
          path: kernel/
          if-no-files-found: error

  bundle:
    name: pyo-sandbox-linux-${{ matrix.arch }}
    needs: kernel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      # ring compiles C for the musl target, with musl-gcc.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo build --release --locked -p pyo-sandbox -p pyo-envd --target "$TARGET"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest-kernel-${{ matrix.arch }}
          path: kernel
      - name: Pack
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          crates/pyo-sandbox/scripts/bundle.sh --arch "$ARCH" \
            --sandbox "target/$TARGET/release/pyo-sandbox" --envd "target/$TARGET/release/pyo-envd" \
            --kernel kernel/vmlinux --out out
      # Built on the platform it's for: each binary must at least start.
      - name: Check it runs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir check
          tar -xzf "out/pyo-sandbox-linux-$ARCH.tar.gz" -C check
          check/pyo-sandbox --version
          check/pyo-envd --version
          check/firecracker --version
          check/jailer --version
          file check/pyo-sandbox check/pyo-envd | tee /dev/stderr | grep -c 'static' | grep -qx 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
