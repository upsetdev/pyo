[package]
name = "pyo-static"
description = "Serves a cluster's static sites (Pyo Static)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
futures.workspace = true
hex = "0.4.3"
pyo-proto = { version = "0.4.2", path = "../pyo-proto" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
tokio.workspace = true
tokio-util = { version = "0.7.20", features = ["io"] }
tracing.workspace = true
tracing-subscriber.workspace = true


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
