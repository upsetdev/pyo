[package]
name = "pyo-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pyo-verify"
path = "src/main.rs"

# A small static binary that runs as root on a customer's server: no async
# runtime, no HTTP or Kubernetes client (it runs curl and k3s kubectl).
# Think twice before adding to this list.
[dependencies]
hex = "0.4.3"
pyo-sigstore = { path = "../pyo-sigstore" }
serde_json = "1.0.154"
sha2 = "0.11.1"
