[package]
name = "pyo-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
cookie = "0.18"
pyo-proto = { version = "0.2.0", path = "../pyo-proto", features = ["openapi"] }
hex = "0.4.3"
hmac = "0.13.0"
jiff = "0.2.38"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-native-certs"] }
libc = "0.2.191"
maxminddb = { version = "0.32", features = ["mmap"] }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
utoipa = { version = "5.5.0", features = ["preserve_order", "preserve_path_order"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
woothee = "0.13"
webauthn-rs = { version = "=0.6.2", features = ["danger-allow-state-serialisation", "conditional-ui"] }
x509-parser = "0.18"
tokio-tungstenite = "0.29"
futures = "0.3.34"
crypto_secretbox = "0.1.1"
zeroize = "1"
flate2 = "1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
serde_norway = "0.9.42"

[dev-dependencies]
boon = "0.6.1"
