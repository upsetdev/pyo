[package]
name = "pyo-cli"
description = "The Pyo command line: deploy, logs, environment and more."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pyo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
flate2 = "1"
futures = "0.3.34"
hex = "0.4.3"
hostname = "0.4"
ignore = "0.4"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "fs"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
toml = "0.9"
pyo-proto = { version = "0.52.0-rc.1", path = "../pyo-proto" }

[dev-dependencies]
# The JSON Schema of pyo.jsonc, written from the config types by a test.
schemars = "1.2.3"
