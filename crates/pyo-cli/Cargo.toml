[package]
name = "pyo-cli"
description = "The Pyo command line: deploy, logs, environment and more."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pyo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
futures = "0.3.34"
hex = "0.4.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "fs"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
toml = "0.9"
pyo-proto = { version = "0.2.3", path = "../pyo-proto" }
