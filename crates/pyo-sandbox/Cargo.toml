[package]
name = "pyo-sandbox"
description = "The Pyo Sandbox daemon: runs sandboxes as Firecracker microVMs on a sandbox server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
pyo-proto = { version = "0.3.2", path = "../pyo-proto", features = ["sandbox-token"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# ring, like pyo-proto's tokens, so the daemon builds for musl without cmake.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
