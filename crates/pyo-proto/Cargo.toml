[package]
name = "pyo-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sha2 = "0.11.1"
utoipa = { version = "5.5.0", optional = true }

[dev-dependencies]
# The admission policy's patterns (CEL `matches` is RE2, which this follows).
regex = "1.13.1"

[features]
# Schemas for the API reference (pyo-api's openapi command).
openapi = ["dep:utoipa"]
