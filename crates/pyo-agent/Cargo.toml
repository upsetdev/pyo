[package]
name = "pyo-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
pyo-proto = { version = "0.52.0", path = "../pyo-proto", features = ["command-signing"] }
futures = "0.3.34"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
http = "1.5.0"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", default-features = false, features = ["runtime", "client", "rustls-tls", "ws"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
base64 = "0.23.1"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# The traffic store (traffic/): countries, user agents, kept files.
maxminddb = { version = "0.32", features = ["mmap"] }
woothee = "0.13"
flate2 = "1"
sha2 = "0.11.1"
jiff = "0.2.38"
# The one-token Tailscale setup (tailscale/setup.rs): the policy is HuJSON,
# and the pasted token is wiped once used.
jsonc-parser = { version = "0.34.0", features = ["cst", "serde"] }
zeroize = "1"
hex = "0.4.3"

[dev-dependencies]
# A mock Tailscale API in tests.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
