[package]
name = "pyo-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
pyo-proto = { version = "0.2.1", path = "../pyo-proto" }
futures = "0.3.34"
http = "1.5.0"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", default-features = false, features = ["runtime", "client", "rustls-tls", "ws"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
base64 = "0.23.1"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
