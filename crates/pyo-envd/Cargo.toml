[package]
name = "pyo-envd"
description = "The agent inside every Pyo sandbox: exec, terminals, files and ports over vsock"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Ships as a static musl binary:
#   cargo build --release -p pyo-envd --target x86_64-unknown-linux-musl
# No async runtime, to keep it small. Threads are cheap inside a sandbox.

[dependencies]
libc = "0.2.191"
pyo-proto = { version = "0.4.0", path = "../pyo-proto" }
serde_json.workspace = true
