[workspace]
resolver = "3"
members = ["crates/pyo-proto", "crates/pyo-api", "crates/pyo-agent", "crates/pyo-builder", "crates/pyo-cli", "crates/pyo-flows", "crates/pyo-resp", "crates/pyo-kv", "crates/pyo-db-controller"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
publish = false

# Shared by the database crates (pyo-db-controller, pyo-kv, pyo-resp).
[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
pyo-resp = { path = "crates/pyo-resp" }

# The images scripts/pyo-up.sh builds (CARGO_PROFILE in
# deploy/images/pyo.Dockerfile): release's settings, but quicker to compile.
# Releases build with `release`.
[profile.dev-release]
inherits = "release"
codegen-units = 256
